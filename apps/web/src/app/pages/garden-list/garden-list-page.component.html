<app-page-layout
  title="Gardens"
  subtitle="All the gardens you are taking care of."
  [loading]="isLoading()"
>
  @if (list().length) {
    <button
      pageActions
      matButton="filled"
      type="button"
      [disabled]="isLoading()"
      (click)="createNew()"
    >
      <mat-icon>add</mat-icon>
      New garden
    </button>
  }

  <app-garden-list
    [gardens]="list()"
    [disabled]="isLoading()"
    (create)="createNew()"
    (edit)="update($event)"
    (remove)="remove($event)"
  />
</app-page-layout>
