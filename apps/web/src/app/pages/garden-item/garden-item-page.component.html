<app-page-layout
  [title]="garden().gardenName"
  subtitle="Garden details"
  [backLink]="link"
  backLabel="Back to gardens"
>
  <app-garden-details [garden]="garden()" />
  <app-plant-list
    [plants]="plants()"
    [disabled]="isLoading()"
    (create)="createNew()"
    (update)="update($event)"
    (remove)="remove($event)"
  ></app-plant-list>
</app-page-layout>
