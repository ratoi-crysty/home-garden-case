<mat-card appearance="outlined">
  <mat-card-header>
    <div mat-card-avatar class="avatar">
      <mat-icon aria-hidden="true">yard</mat-icon>
    </div>
    <mat-card-title>{{ garden().gardenName }}</mat-card-title>
    <mat-card-subtitle>Garden #{{ garden().gardenId }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <app-property-list [items]="properties()" />
  </mat-card-content>
</mat-card>
