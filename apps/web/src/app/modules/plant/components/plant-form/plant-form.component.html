<mat-card>
  <mat-card-header>
    <mat-card-title>{{ data.plant ? 'Update' : 'Add' }} plant</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form class="form" (submit)="handleSubmit($event)" novalidate>
      <app-input-text class="full" label="Name" [field]="form.plantName" />
      <app-input-text label="Species" [field]="form.species" />

      <mat-form-field>
        <mat-label>Type</mat-label>
        <mat-select [formField]="form.plantType">
          <mat-option value="vegetable">Vegetable</mat-option>
          <mat-option value="fruit">Fruit</mat-option>
          <mat-option value="flower">Flower</mat-option>
        </mat-select>
        @for (error of form.plantType().errors(); track error.kind) {
          <mat-error>{{ error.message }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field class="full">
        <mat-label>Plantation date</mat-label>
        <input matInput type="date" [formField]="form.plantationDate" />
        @for (error of form.plantationDate().errors(); track error.kind) {
          <mat-error>{{ error.message }}</mat-error>
        }
      </mat-form-field>

      <app-input-number label="Surface required (m²)" [field]="form.surfaceAreaRequired" />
      <app-input-number label="Ideal humidity (%)" [field]="form.idealHumidityLevel" />

      <div class="actions full">
        <button matButton type="button" mat-dialog-close [disabled]="loading()">Cancel</button>
        <button matButton="filled" type="submit" [disabled]="loading()">Save</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
